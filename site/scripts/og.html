<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>prosed share image</title>
    <style>
      /* The 1200×630 share image. Rendered once to public/og.png with headless Chromium; values from src/styles/tokens.css. */
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../public/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 700;
        src: url("../public/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
      }
      :root {
        --color-paper: #ece7dc;
        --color-ink: #15181d;
        --color-ink-soft: color-mix(in oklch, var(--color-ink) 68%, var(--color-paper));
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-mono);
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        font-size: 112px;
        font-weight: 700;
        font-style: normal;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        margin: 24px 0 0;
        color: var(--color-ink-soft);
        font-size: 38px;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="wordmark">
      <img src="../public/brand/prosed.svg" alt="" width="56" height="56" />
      prosed
    </div>
    <div>
      <h1>sed for your prose.</h1>
      <p>A grammar checker that runs on your machine.</p>
    </div>
  </body>
</html>
